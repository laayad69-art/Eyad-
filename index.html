<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eyad Alaa | ZMAX3</title>
<meta name="description" content="Eyad Alaa — ZMAX3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#ffffff;
    --bg-1:#f4f8ff;
    --blue:#2563eb;
    --blue-deep:#1d4ed8;
    --blue-soft:#60a5fa;
    --text:#0f172a;
    --text-dim:#64748b;
    --glass:rgba(37,99,235,.035);
    --glass-hi:rgba(37,99,235,.06);
    --border:rgba(37,99,235,.14);
    --border-hi:rgba(37,99,235,.4);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background:
      radial-gradient(ellipse 800px 460px at 12% -8%, rgba(37,99,235,.08), transparent 60%),
      radial-gradient(ellipse 800px 500px at 95% 10%, rgba(96,165,250,.09), transparent 55%),
      var(--bg-0);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .en{font-family:'Space Grotesk',sans-serif;}

  /* ---------- Background ---------- */
  #bg-grid{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(37,99,235,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,.045) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 25%, #000 30%, transparent 85%);
    mask-image:radial-gradient(ellipse 80% 55% at 50% 25%, #000 30%, transparent 85%);
    pointer-events:none;
  }

  /* ---------- Layout ---------- */
  .wrap{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:56px 20px 40px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .hero{
    text-align:center;
    margin-bottom:34px;
  }

  .avatar-ring{
    width:104px;height:104px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--blue-soft), var(--blue-deep));
    padding:2.5px;
    opacity:0;
    animation:pop-in .7s cubic-bezier(.2,.8,.2,1) .1s forwards;
    box-shadow:0 10px 30px -10px rgba(37,99,235,.4);
  }

  .avatar{
    width:100%;height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#ffffff;
  }
  .avatar img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }

  .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.3px;
    opacity:0;
    animation:pop-in .6s ease .28s forwards;
  }

  .username{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    color:var(--blue);
    margin-top:6px;
    opacity:0;
    animation:pop-in .6s ease .4s forwards;
  }

  @keyframes pop-in{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Links ---------- */
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:18px;
    text-decoration:none;
    color:var(--text);
    background:var(--glass);
    border:1px solid var(--border);
    cursor:pointer;
    overflow:hidden;
    opacity:0;
    transform:translateY(14px);
    animation:card-in .55s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s, background .35s;
  }
  .card:nth-child(1){animation-delay:.5s;}
  .card:nth-child(2){animation-delay:.58s;}
  .card:nth-child(3){animation-delay:.66s;}
  .card:nth-child(4){animation-delay:.74s;}
  .card:nth-child(5){animation-delay:.84s;}

  @keyframes card-in{to{opacity:1; transform:translateY(0);}}

  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    border-color:var(--border-hi);
    box-shadow:0 14px 30px -16px rgba(37,99,235,.3);
    background:var(--glass-hi);
  }

  .icon-box{
    flex-shrink:0;
    width:46px;height:46px;
    border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(37,99,235,.08);
    border:1px solid rgba(37,99,235,.16);
    color:var(--blue);
    transition:box-shadow .35s;
  }
  .card:hover .icon-box{
    box-shadow:0 0 0 4px rgba(37,99,235,.08);
  }
  .icon-box svg{width:22px;height:22px;}

  .card-body{flex:1; min-width:0;}
  .card-title{
    font-size:15.5px;
    font-weight:700;
  }
  .card-desc{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:3px;
  }

  .arrow{
    flex-shrink:0;
    width:18px;height:18px;
    color:var(--text-dim);
    transition:transform .35s, color .35s;
  }
  .card:hover .arrow{
    transform:translateX(-5px);
    color:var(--blue);
  }

  /* Featured card */
  .card.featured{
    padding:19px 20px;
    background:linear-gradient(135deg, rgba(37,99,235,.09), rgba(96,165,250,.06));
    border:1px solid rgba(37,99,235,.3);
    margin-top:6px;
  }
  .card.featured .icon-box{
    width:52px;height:52px;
    background:linear-gradient(135deg, var(--blue-soft), var(--blue-deep));
    border-color:transparent;
    color:#ffffff;
  }
  .card.featured:hover{
    border-color:rgba(37,99,235,.55);
    box-shadow:0 16px 34px -16px rgba(37,99,235,.4);
  }
  .card.featured .card-title{font-size:16.5px;}
  .badge{
    position:absolute;
    top:12px;
    inset-inline-start:14px;
    font-family:'Space Grotesk',sans-serif;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#ffffff;
    background:linear-gradient(120deg,var(--blue),var(--blue-soft));
    padding:3px 8px;
    border-radius:20px;
  }
  .card.featured .card-body{padding-inline-start:2px; margin-top:4px;}

  /* ---------- Footer ---------- */
  footer{
    text-align:center;
    margin-top:40px;
    padding-top:22px;
    color:var(--text-dim);
    font-size:12px;
    line-height:1.9;
    opacity:0;
    animation:pop-in .6s ease .95s forwards;
  }
  footer .made{
    font-family:'Space Grotesk',sans-serif;
    color:#94a3b8;
    font-size:11.5px;
  }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-ring,.name,.username,.card,footer{animation:none !important; opacity:1 !important;}
  }

  @media (min-width:640px){
    .wrap{padding-top:72px;}
    .name{font-size:29px;}
  }
</style>
</head>
